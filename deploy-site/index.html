const NEWS_CACHE_KEY='cw_newscache';
const NEWS_SOURCES=[
  {name:'每日要闻',
   url:'https://60s.viki.moe/v2/60s?encoding=json',
   pick:j=>(((j&&j.data&&j.data.news)||[]).map(s=>({c:'今日要闻',t:String(s).trim(),b:'',d:(j.data&&j.data.date)||'',u:'https://www.baidu.com/s?wd='+encodeURIComponent(String(s).trim().slice(0,40))})))},
  {name:'中新网·即时',
   url:'https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://www.chinanews.com.cn/rss/scroll-news.xml'),
   pick:j=>newsRss(j,'社会')},
  {name:'中新网·国内',
   url:'https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://www.chinanews.com.cn/rss/china.xml'),
   pick:j=>newsRss(j,'国内')}
];
function newsCatOf(u){
  if(/\/gn\//.test(u))return '国内';if(/\/gj\//.test(u))return '国际';
  if(/\/cj\//.test(u))return '财经';if(/\/sp\//.test(u))return '体育';
  if(/\/kj\//.test(u))return '科技';if(/\/sh\//.test(u))return '社会';
  return '';
}
function newsRss(j,cat){
  if(!j||j.status!=='ok'||!Array.isArray(j.items))return [];
  return j.items.map(it=>({
    c:newsCatOf(it.link||'')||cat,
    t:String(it.title||'').trim(),
    b:String(it.description||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim().slice(0,120),
    d:String(it.pubDate||'').slice(0,10),
    u:it.link||''
  })).filter(x=>x.t);
}
async function fetchLiveNews(){
  for(const s of NEWS_SOURCES){
    try{
      const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),8000);
      const r=await fetch(s.url,{signal:ctrl.signal,cache:'no-store'});clearTimeout(to);
      if(!r.ok)continue;
      const j=await r.json();
      const items=(s.pick(j)||[]).filter(x=>x&&x.t).slice(0,12);
      if(items.length)return {items,src:s.name,at:Date.now()};
    }catch(e){/* 换下一个源 */}
  }
  return null;
}
function readNewsCache(){
  try{const o=JSON.parse(localStorage.getItem(NEWS_CACHE_KEY)||'null');if(o&&Array.isArray(o.items)&&o.items.length)return o;}catch(e){}
  return null;
}
function writeNewsCache(o){try{localStorage.setItem(NEWS_CACHE_KEY,JSON.stringify(o));}catch(e){}}

function renderNews(){
  const c=$('#content');
  /* 离线内置要闻：按 6 小时一个时段轮换，一天之内也会变化 */
  const slot=Math.floor(Date.now()/(1000*60*60*6));
  const offline=()=>{const n=NEWS_DB.length;const st=slot%n;return [0,1,2,3,4,5].map(i=>NEWS_DB[(st+i)%n]);};
  c.innerHTML=`
  <div class="mod-head"><div class="mi" style="background:color-mix(in srgb,var(--c1) 16%,transparent);color:var(--c1)">📰</div><div><h2>热点新闻</h2><p>每日时政要闻 · 实时更新</p></div></div>
  <div class="row" style="margin-bottom:12px;flex-wrap:wrap;gap:8px;align-items:center">
    <span class="nbadge off" id="newsBadge"><span class="dot"></span><span id="newsBadgeTx">内置要闻</span></span>
    <button class="btn primary" id="newsRefresh">🔄 立即刷新</button>
    <button class="btn" id="newsAuto">⏱ 自动刷新：开</button>
    <span class="muted" id="newsStat"></span>
  </div>
  <div id="newsBox"></div>
  <div class="placeholder-note" style="background:var(--m1);color:var(--c1)">联网实时抓取公开资讯源（60秒每日要闻 / 中新网即时新闻 / 中新网国内），打开页面即自动拉取、每 30 分钟自动更新一次；无网络时自动展示内置要闻（按时段轮换）。</div>`;
  const fmtTime=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
  const draw=arr=>{$('#newsBox').innerHTML=arr.map(n=>`
    <div class="card news-card" style="margin-bottom:12px;border-left-color:${/时政|今日要闻|国内/.test(n.c)?'var(--c1)':(/经济|财经/.test(n.c)?'var(--c3)':'var(--c2)')}">
      <div class="row" style="margin-bottom:6px;align-items:center;gap:8px"><span class="tag">${esc(n.c||'要闻')}</span><span class="muted" style="font-size:12px">${esc(n.d||'')}</span></div>
      ${n.u?`<a class="nt" href="${esc(n.u)}" target="_blank" rel="noopener">${esc(n.t)}</a>`:`<div class="nt">${esc(n.t)}</div>`}
      ${n.b?`<div class="muted" style="font-size:13px">${esc(n.b)}</div>`:''}
    </div>`).join('');};
  const setBadge=(live,tx)=>{const b=$('#newsBadge');b.className='nbadge '+(live?'live':'off');$('#newsBadgeTx').textContent=tx;};
  let useCache=false;
  const paint=()=>{
    const cache=readNewsCache();
    if(cache){draw(cache.items);setBadge(true,'实时 · '+cache.src);$('#newsStat').textContent='更新于 '+fmtTime(cache.at);useCache=true;}
    else {draw(offline());setBadge(false,'内置要闻（离线）');$('#newsStat').textContent='';useCache=false;}
  };
  const refresh=async(silent)=>{
    const st=$('#newsStat');if(!silent)st.textContent='更新中…';
    const res=await fetchLiveNews();
    if(res){writeNewsCache(res);paint();if(!silent)showBanner('已获取最新要闻');}
    else if(!silent){st.textContent='';showBanner('联网暂不可用，已展示内置要闻');}
    return !!res;
  };
  paint();
  /* 进入模块时：缓存超过 20 分钟就后台静默刷新一次 */
  const cache=readNewsCache();
  if(!cache||Date.now()-(cache.at||0)>20*60*1000)refresh(true);
  $('#newsRefresh').onclick=()=>refresh(false);
  /* 自动刷新（30 分钟一轮，仅在停留于本模块时生效） */
  let auto=(localStorage.getItem(pfx()+'newsAuto')??'1')!=='0';   /* 开关状态持久化，进出模块不再重置 */
  const clearAuto=()=>{if(window._newsTimer){clearInterval(window._newsTimer);window._newsTimer=null;}};
  const armAuto=()=>{clearAuto();if(auto)window._newsTimer=setInterval(()=>{if(curTab==='news')refresh(true);else clearAuto();},30*60*1000);};
  $('#newsAuto').onclick=()=>{auto=!auto;localStorage.setItem(pfx()+'newsAuto',auto?'1':'0');$('#newsAuto').textContent='⏱ 自动刷新：'+(auto?'开':'关');armAuto();showBanner(auto?'已开启每30分钟自动刷新':'已关闭自动刷新');};
  $('#newsAuto').textContent='⏱ 自动刷新：'+(auto?'开':'关');
  armAuto();
  /* 切回标签页/跨过零点时补一次刷新（只绑定一次，避免反复进出新闻模块累积监听器） */
  if(!window._newsVisBound){window._newsVisBound=true;
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&curTab==='news'){const cc=readNewsCache();if(!cc||Date.now()-(cc.at||0)>20*60*1000)refresh(true);}});
  }
}

    const pomoByTask={};
    (DATA.pomo||[]).filter(r=>r&&r.kind==='work'&&r.task).forEach(r=>{const k=String(r.task).trim();pomoByTask[k]=(pomoByTask[k]||0)+(+r.min||0);});

    const sorted=arr.slice().sort((a,b)=>{const ka=(a.date||'9999-99-99')+' '+(a.time||'99:99'),kb=(b.date||'9999-99-99')+' '+(b.time||'99:99');return ka<kb?-1:ka>kb?1:0;});
    box.innerHTML=sorted.map(s=>{

          <span class="del" data-toggle="${s.id}" style="cursor:pointer;font-size:18px;color:${s.done?'var(--c2)':'var(--muted)'}">${s.done?'☑':'☐'}</span>
          <div style="min-width:0">
            <div style="${s.done?'text-decoration:line-through':''}">${esc(s.title)}</div>
            <div class="meta">${esc(s.date||'无期限')}${s.time?' '+esc(s.time):''} ${doneBadge(s)} ${pmTag}</div>
          </div>
        </div>
        <span class="del" data-id="${s.id}">删除</span>
      </li>`;}).join('');
    box.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const it=(DATA.schedule||[]).find(x=>x.id===b.dataset.toggle);if(!it)return;it.done=!it.done;save('schedule');render();if(it.done){confetti(40);showBanner('🎉 完成一件待办！');}});
    box.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{if(!confirm('删除该待办？'))return;DATA.schedule=DATA.schedule.filter(x=>x.id!==b.dataset.id);save('schedule');render();});
  };
  $('#scAdd').onclick=()=>{
    const title=$('#scTitle').value.trim();if(!title){showBanner('请填写待办内容');return;}
    DATA.schedule=DATA.schedule||[];
    DATA.schedule.unshift({id:uid(),title,date:$('#scDate').value||'',time:$('#scTime').value||'',done:false});

  };
  render();
}

    const sl=last7.map(r=>+r.sleep||0).filter(x=>x>0);
    const avg=sl.length?(sl.reduce((a,b)=>a+b,0)/sl.length).toFixed(1):'—';
    const max=Math.max(8,Math.max.apply(null,last7.map(r=>+r.sleep||0)));

    box.querySelectorAll('[data-hrd]').forEach(a=>a.onclick=()=>{DATA.health.records=healthRecords().filter(x=>x.id!==a.dataset.hrd);save('health');renderHealth();});

    const arr=healthRecords();const d=todayStr();const ex=arr.find(r=>r.date===d);
    if(ex){if(sv)ex.sleep=sv;if(wv)ex.weight=wv;}
    else arr.unshift({id:uid(),date:d,sleep:sv,weight:wv});
    save('health');$('#sleep').value='';$('#weight').value='';renderHealth();drawFit();showBanner('已保存健康记录 ✓');

  /* —— 数据可视化（体重趋势 / 运动时长 / 习惯热力图）—— */
  let hmMonth=todayStr().slice(0,7);
  const drawFit=()=>{
    const recs=(DATA.health&&Array.isArray(DATA.health.records))?DATA.health.records:[];
    const wByDay={};recs.forEach(r=>{if(r.date&&r.weight&&!(r.date in wByDay))wByDay[r.date]=+r.weight;});
    const wdays=lastDays(14).filter(d=>wByDay[d]!=null);
    const wb=$('#fitWeight');
    wb.innerHTML=wdays.length?svgLine(wdays.map(d=>({l:d.slice(5),v:wByDay[d]})),{color:'var(--c7,#5BA0A0)'}):'<div class="empty-hint">还没有体重记录</div>';
    const exByDay={};(exArr()).forEach(e=>{if(e.date)exByDay[e.date]=(exByDay[e.date]||0)+(+e.min||0);});
    $('#fitEx').innerHTML=svgBars(lastDays(14).map(d=>({l:d.slice(5),v:exByDay[d]||0})),{color:'var(--c2)'});
    const hset=new Set();
    (DATA.habits||[]).forEach(h=>{if(h.records)Object.keys(h.records).forEach(d=>{if((+h.records[d]||0)>0)hset.add(d);});});
    $('#fitHeat').innerHTML=heatMonth(hset,{date:hmMonth});
  };
  $('#fitHmPrev').onclick=()=>{const p=hmMonth.split('-').map(Number);let y=p[0],m=p[1]-1;if(m<1){m=12;y--;}hmMonth=`${y}-${pad2(m)}`;drawFit();};
  $('#fitHmNext').onclick=()=>{const p=hmMonth.split('-').map(Number);let y=p[0],m=p[1]+1;if(m>12){m=1;y++;}hmMonth=`${y}-${pad2(m)}`;drawFit();};
  renderEx();renderHabits();renderHealth();drawFit();
}

  </div>

    box.innerHTML=sorted.map(it=>{
      const bd=parseDate(it.bday);let cd='';
      if(bd){const d=daysTo(bd);cd=`<span class="tag" style="background:var(--m4);color:var(--c4)">${d===0?'今天生日 🎉':('还有 '+d+' 天')}</span>`;}
      const md=bd?('生日 '+it.bday):'未设生日';
      return `<li style="flex-direction:column;align-items:stretch;gap:6px">
        <div class="row" style="justify-content:space-between;align-items:center">
          <input id="frName_${it.id}" class="input" style="flex:1;min-width:60px" placeholder="好友名" value="${esc(it.name||'好友')}">
          <span class="del" data-id="${it.id}">删除</span>
        </div>
        <div class="row" style="gap:6px;align-items:center;flex-wrap:wrap">
          <input id="frBday_${it.id}" class="input" style="flex:1;min-width:120px" placeholder="生日 05-20 / 2000-09-20 / 9月20日" value="${esc(it.bday||'')}">
          ${cd}
        </div>
        <div class="meta">${esc(md)}</div>
        <div class="row" style="gap:6px">
          <input id="frLikes_${it.id}" class="input" style="flex:1;min-width:120px" placeholder="喜好 / 礼物灵感…" value="${esc(it.likes||'')}">
          <button class="btn" data-save="${it.id}">保存</button>
        </div>
      </li>`;
    }).join('');
    /* 每行生日输入框：实时格式化 + 失焦规范（与新增框一致） */
    box.querySelectorAll('input[id^="frBday_"]').forEach(inp=>{
      inp.addEventListener('input',e=>{const v=e.target.value;if(!/^[\d\-/. ]+$/.test(v))return;const f=autoFormatBday(v);if(f!==v){e.target.value=f;const n=f.length;try{e.target.setSelectionRange(n,n);}catch(_){}}});
      inp.addEventListener('blur',e=>{const c=fmtCanon(e.target.value);if(c)e.target.value=c;});
    });
    box.querySelectorAll('.del').forEach(b=>b.onclick=()=>{if(!confirm('删除该好友？'))return;DATA.friends=DATA.friends.filter(x=>x.id!==b.dataset.id);save('friends');render();});
    box.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{
      const it=DATA.friends.find(x=>x.id===b.dataset.save);if(!it)return;
      const nm=document.getElementById('frName_'+b.dataset.save).value.trim();
      const rawB=document.getElementById('frBday_'+b.dataset.save).value.trim();
      const bday=/^[\d\-/. ]+$/.test(rawB)?autoFormatBday(rawB):rawB;
      const bd=parseDate(bday);
      if(rawB&&!bd){showBanner('生日未识别，请如：05-20 / 2000-09-20 / 9月20日');return;}
      it.name=nm||'好友';it.bday=bd?fmtCanon(bday):'';it.likes=document.getElementById('frLikes_'+b.dataset.save).value.trim();
      save('friends');showBanner('已保存 ✓');render();
    });
  };
  const fmtCanon=v=>{const bd=parseDate(v);return bd?(bd.y?`${bd.y}-${pad2(bd.mo)}-${pad2(bd.da)}`:`${pad2(bd.mo)}-${pad2(bd.da)}`):'';};
  /* 实时格式化：仅当输入为纯数字/分隔符时自动补 0、插分隔；含名字或中文「月/日」写法交给 blur / 添加逻辑处理 */
  $('#frDate').addEventListener('input',e=>{
    const v=e.target.value;
    if(!/^[\d\-/. ]+$/.test(v))return;
    const f=autoFormatBday(v);
    if(f!==v){e.target.value=f;const n=f.length;try{e.target.setSelectionRange(n,n);}catch(_){}}
  });
  /* 失焦时统一规范为 MM-DD / YYYY-MM-DD（如 5-20 → 05-20，9月20日 → 09-20） */
  $('#frDate').addEventListener('blur',e=>{
    const c=fmtCanon(e.target.value);
    if(c)e.target.value=c;
  });
  $('#frAdd').onclick=()=>{
    let name=$('#frName').value.trim();
    let bday=$('#frDate').value.trim();
    if(/^[\d\-/. ]+$/.test(bday))bday=autoFormatBday(bday);   // 纯数字串先规整（520 → 05-20），含名字/中文日期则保留
    if(!name){const pm=bday.match(/^(.*?)[\s,，]+(\d.*)$/);if(pm){name=pm[1].trim();bday=pm[2].trim();if(/^[\d\-/. ]+$/.test(bday))bday=autoFormatBday(bday);}}
    const bd=parseDate(bday);
    if(!bd){showBanner('未识别到生日日期，请如：05-20 / 2000-09-20 / 9月20日');return;}
    const canon=bd.y?`${bd.y}-${pad2(bd.mo)}-${pad2(bd.da)}`:`${pad2(bd.mo)}-${pad2(bd.da)}`;
    DATA.friends=DATA.friends||[];
    DATA.friends.unshift({id:uid(),name:name||'好友',bday:canon,likes:'',date:todayStr()});
    save('friends');$('#frName').value='';$('#frDate').value='';render();
  };
  render();
}

function compressImage(file,cb){
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=900;let w=img.width,h=img.height;if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);try{cb(cv.toDataURL('image/jpeg',0.7));}catch(e){cb(r.result);}};img.onerror=()=>cb(r.result);img.src=r.result;};r.readAsDataURL(file);
}

/* ===== 专注统计 ===== */
function renderFocus(){
  const c=$('#content');
  const arr=DATA.pomo||[];
  const work=arr.filter(r=>r&&r.kind==='work');
  const abort=arr.filter(r=>r&&r.kind==='abort');
  c.innerHTML=`
  <div class="mod-head"><div class="mi" style="background:color-mix(in srgb,var(--c3) 16%,transparent);color:var(--c3)">🍅</div><div><h2>专注统计</h2><p>番茄钟复盘 · 时段分布 · 导出</p></div></div>
  <div class="card"><div class="kpi-row" id="fKpis"></div></div>
  <div class="card"><h3>🕐 24 小时专注分布</h3><div id="fHour"></div></div>
  <div class="card"><h3>📅 近 8 周专注（分钟）</h3><div id="fWeek"></div></div>
  <div class="card"><h3>📆 近 6 月专注（分钟）</h3><div id="fMonth"></div></div>
  <div class="card"><h3>🎯 任务投入排行</h3><div id="fTasks"></div></div>
  <div class="card"><h3>📋 专注明细（最近 40 条）</h3><div style="margin-bottom:8px"><button class="btn" id="fCsv">⬇️ 导出 CSV</button></div><ul class="list" id="fDetail"></ul></div>`;
  const d=todayStr();
  const tWork=work.filter(r=>r.date===d);
  const tMin=tWork.reduce((a,r)=>a+(+r.min||0),0);
  const aMin=work.reduce((a,r)=>a+(+r.min||0),0);
  const daySet=new Set(work.map(r=>r.date));
  let streak=0,cur=new Date();
  if(!daySet.has(todayStr()))cur=new Date(shiftDate(-1)+'T00:00:00');
  while(daySet.has(ymd(cur))){streak++;cur.setDate(cur.getDate()-1);}
  const abortRate=work.length?Math.round(abort.length/(abort.length+work.length)*100):0;
  $('#fKpis').innerHTML=`
    <div class="kpi"><div class="kpi-n">${tWork.length}</div><div class="kpi-l">今日番茄</div></div>
    <div class="kpi"><div class="kpi-n">${Math.round(tMin)}</div><div class="kpi-l">今日分钟</div></div>
    <div class="kpi"><div class="kpi-n">${work.length}</div><div class="kpi-l">累计番茄</div></div>
    <div class="kpi"><div class="kpi-n">${Math.round(aMin)}</div><div class="kpi-l">累计分钟</div></div>
    <div class="kpi"><div class="kpi-n">${streak}</div><div class="kpi-l">连续天数</div></div>
    <div class="kpi"><div class="kpi-n">${abortRate}%</div><div class="kpi-l">中断率</div></div>`;
  const hrs=new Array(24).fill(0);
  work.forEach(r=>{const h=(r.at||'00:00').slice(0,2);hrs[+h]=(hrs[+h]||0)+1;});
  $('#fHour').innerHTML=svgBars(hrs.map((v,i)=>({l:(i%6===0?i:''),v})),{w:560,h:120,xlab:6});
  const weekStart=ds=>{const x=new Date(ds+'T00:00:00');const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return ymd(x);};
  const wkMap={};work.forEach(r=>{const ws=weekStart(r.date);wkMap[ws]=(wkMap[ws]||0)+(+r.min||0);});
  const wkKeys=Object.keys(wkMap).sort(),wkLast=wkKeys.slice(-8);
  $('#fWeek').innerHTML=wkLast.length?svgBars(wkLast.map(k=>({l:k.slice(5),v:wkMap[k]})),{color:'var(--c3)'}):'<div class="empty-hint">还没有专注记录</div>';
  const now=new Date(),months=[];for(let i=5;i>=0;i--){const x=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(`${x.getFullYear()}-${pad2(x.getMonth()+1)}`);}
  const moMap={};work.forEach(r=>{const m=(r.date||'').slice(0,7);if(m)moMap[m]=(moMap[m]||0)+(+r.min||0);});
  $('#fMonth').innerHTML=svgBars(months.map(m=>({l:m.slice(2),v:moMap[m]||0})),{color:'var(--c2)'});
  const tkMap={};work.forEach(r=>{const k=String(r.task||'').trim();if(k)tkMap[k]=(tkMap[k]||0)+(+r.min||0);});
  const tkTop=Object.keys(tkMap).map(k=>({k,v:tkMap[k]})).sort((a,b)=>b.v-a.v).slice(0,8);
  $('#fTasks').innerHTML=tkTop.length?tkTop.map(t=>`<div class="mini-li"><span title="${esc(t.k)}">${esc(t.k)}</span><span class="meta">${t.v} 分</span></div>`).join(''):'<div class="empty-hint">还没有带任务的专注</div>';
  const box=$('#fDetail');
  const recent=arr.slice(0,40);
  box.innerHTML=recent.length?recent.map(r=>`<li><div><div>${r.kind==='abort'?'⛔ 中断':'🍅 专注'}${r.task?(' · '+esc(r.task)):''}</div><div class="meta">${esc(r.date||'')} ${esc(r.at||'')}</div></div><span>${Math.round(r.min||0)} 分 <span class="del" data-id="${r.id}">×</span></span></li>`).join(''):'<div class="empty-hint">还没有专注记录</div>';
  box.querySelectorAll('.del').forEach(x=>x.onclick=()=>{DATA.pomo=DATA.pomo.filter(mm=>mm.id!==x.dataset.id);save('pomo');renderFocus();});
  $('#fCsv').onclick=()=>{const head=['日期','时间','类型','时长(分)','任务'];const rows=arr.map(r=>[r.date||'',r.at||'',r.kind==='abort'?'中断':'专注',Math.round(r.min||0),r.task||'']);downloadFile('专注记录-'+ACCOUNT.id+'.csv',toCSV(head,rows));};
}

        <div class="ov-row"><input type="text" id="newName" placeholder="账户名" class="input" style="flex:1;min-width:100px"><input type="password" id="newPwd" placeholder="密码(可空)" class="input" style="flex:1;min-width:100px"><button class="btn primary" id="newAcct">创建</button></div>
        <div class="muted" style="margin:10px 0 6px">当前账户密码</div>
        <div class="ov-row"><input type="password" id="setPwd" placeholder="留空=取消密码" class="input" style="flex:1"><button class="btn" id="savePwd">设置/修改</button></div>
        <div class="muted" style="margin:10px 0 6px">数据备份</div>
        <div class="ov-row"><button class="btn" id="expBtn">⬇️ 导出备份</button><button class="btn" id="impBtn">⬆️ 导入恢复</button><input type="file" id="impFile" accept="application/json" style="display:none"></div>
        <div class="muted" style="margin:10px 0 6px">分类导出（CSV · Excel 可直接打开）</div>
        <div class="ov-row" style="flex-wrap:wrap;gap:6px">
          <button class="btn" id="csvFinance">收支</button>
          <button class="btn" id="csvDiet">饮食</button>
          <button class="btn" id="csvPomo">番茄</button>
          <button class="btn" id="csvHabits">习惯</button>
          <button class="btn" id="csvHealth">健康</button>
        </div>
        <div class="muted" style="margin:10px 0 6px">笔记导出</div>
        <div class="ov-row"><button class="btn" id="mdAll">📝 导出全量 Markdown 笔记</button></div>
      </div>
      <div class="ov-row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="closeAcct">关闭</button></div>
    </div>`;
    const list=ov.querySelector('#acctList');
    list.innerHTML=acts.length?acts.map(a=>`<div class="ov-acct ${a.id===cur?'current':''}"><span>${esc(a.name)}${a.pwd?' 🔒':''}</span>${a.id===cur?'<span class="muted">当前</span>':`<button class="btn" data-sw="${a.id}">切换</button>`}</div>`).join(''):'<div class="empty-hint">暂无其他账户</div>';
    list.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>switchAccount(b.dataset.sw));
    ov.querySelector('#newAcct').onclick=()=>{const nm=ov.querySelector('#newName').value.trim();if(!nm){showBanner('请填写账户名');return;}const pw=ov.querySelector('#newPwd').value;const acts2=getAccounts();if(acts2.some(a=>a.name===nm)){showBanner('账户名已存在');return;}const id='a'+uid();const rec={id,name:nm,pwd:pw?hashPwd(pw):''};acts2.push(rec);saveAccounts(acts2);setActive(rec);loadAll();renderSidebar();switchTab(curTab);showBanner('已创建并切换到 '+nm);};
    ov.querySelector('#savePwd').onclick=()=>{const pw=ov.querySelector('#setPwd').value;const a=getAccounts().find(x=>x.id===ACCOUNT.id);if(!a)return;a.pwd=pw?hashPwd(pw):'';saveAccounts(getAccounts().map(x=>x.id===a.id?a:x));ACCOUNT.pwd=a.pwd;setActive(ACCOUNT);switchTab(curTab);showBanner(pw?'已设置密码🔒':'已取消密码');};
    ov.querySelector('#expBtn').onclick=exportBackup;
    ov.querySelector('#impBtn').onclick=()=>ov.querySelector('#impFile').click();
    ov.querySelector('#impFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{importBackup(JSON.parse(rd.result));}catch(err){showBanner('文件格式错误');}e.target.value='';};rd.readAsText(f);};
    const dlCSV=(name,head,rows)=>downloadFile(name+'-'+ACCOUNT.id+'.csv',toCSV(head,rows));
    const exportMarkdown=()=>{
      const L=['# 我的生活记录 · '+ACCOUNT.name+' · '+todayStr()];
      const sec=(h,items)=>{if(items&&items.length){L.push('\n## '+h);items.forEach(t=>L.push('- '+String(t).replace(/\n/g,' ')));}};
      sec('💡 灵感',(DATA.idea||[]).map(x=>x.text));
      sec('🌟 心愿',(DATA.wish||[]).map(x=>x.text));
      sec('🎯 目标',(DATA.goal||[]).map(g=>g.text+(g.milestones&&g.milestones.length?('（'+g.milestones.map(m=>m.text).join('、')+'）'):'')));
      sec('🛒 待买',(DATA.shopping||[]).map(x=>x.text));
      sec('📝 碎碎念',(DATA.mood||[]).map(x=>(x.date||'')+' '+x.text));
      sec('📚 书影音',(DATA.media||[]).map(m=>m.title+' '+(m.review||'')+' '+((m.takeaways||[]).join('；'))));
      sec('🎂 好友',(DATA.friends||[]).map(f=>f.name+(f.bday?' '+f.bday:'')+(f.likes?(' 喜好:'+f.likes):'')));
      sec('📋 待办',(DATA.schedule||[]).map(s=>s.title+(s.date?(' @'+s.date):'')+(s.done?' ✓':'')));
      sec('💗 情绪',(DATA.moodlog||[]).map(m=>(m.date||'')+' '+(m.emoji||'')+' '+(m.note||'')+' '+((m.tags||[]).join('、'))));
      downloadFile('生活记录-'+ACCOUNT.id+'.md',L.join('\n'));
    };
    ov.querySelector('#csvFinance').onclick=()=>dlCSV('收支流水',['日期','类型','金额','备注'],(DATA.finance||[]).map(f=>[f.date||'',f.type==='income'?'收入':'支出',f.amount||0,f.note||'']));
    ov.querySelector('#csvDiet').onclick=()=>dlCSV('饮食',['日期','餐别','食物','热量'],(DATA.diet||[]).map(m=>[m.date||'',m.meal||'',m.text||'',m.kcal||'']));
    ov.querySelector('#csvPomo').onclick=()=>dlCSV('番茄记录',['日期','时间','类型','时长(分)','任务'],(DATA.pomo||[]).map(r=>[r.date||'',r.at||'',r.kind==='abort'?'中断':'专注',Math.round(r.min||0),r.task||'']));
    ov.querySelector('#csvHabits').onclick=()=>{const rows=[];(DATA.habits||[]).forEach(h=>{if(h.records)Object.keys(h.records).forEach(d=>{if((+h.records[d]||0)>0)rows.push([h.name,d,h.mode==='count'?('计数 '+h.records[d]):'打卡']);});});dlCSV('习惯打卡',['习惯','日期','值'],rows);};
    ov.querySelector('#csvHealth').onclick=()=>dlCSV('健康记录',['日期','睡眠','体重'],((DATA.health&&DATA.health.records)||[]).map(r=>[r.date||'',r.sleep||'',r.weight||'']));
    ov.querySelector('#mdAll').onclick=exportMarkdown;
    ov.querySelector('#closeAcct').onclick=()=>ov.classList.remove('show');
  };
  render();ov.classList.add('show');
}
function switchAccount(id){
  const a=getAccounts().find(x=>x.id===id);if(!a)return;
  if(a.pwd){const pw=prompt('「'+a.name+'」需要密码：');if(!pw)return;if(hashPwd(pw)!==a.pwd){alert('密码错误');return;}}
  setActive(a);loadAll();renderSidebar();closeLock();switchTab(curTab);showBanner('已切换到 '+a.name);
}
function exportBackup(){
  const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('cw_'+ACCOUNT.id+'_'))keys.push(k);}
  keys.push('cw_active','cw_accounts','cw_theme','cw_palette','cw_navorder');
  const data={__app:'mao-workspace',account:ACCOUNT,keys:{}};
  keys.forEach(k=>{try{data.keys[k]=localStorage.getItem(k);}catch(e){}});
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workspace-backup-'+ACCOUNT.id+'.json';a.click();
  showBanner('已导出备份（当前账户）');
}
function importBackup(data){
  if(!data||!data.keys){showBanner('备份文件无效');return;}
  if(!confirm('导入将覆盖同名数据（含账户列表与主题设置），确定继续？'))return;
  /* 还原全部键（账户数据 + 全局设置），使其成为完整快照恢复 */
  Object.keys(data.keys).forEach(k=>{try{localStorage.setItem(k,data.keys[k]);}catch(e){}});
  try{const a=JSON.parse(localStorage.getItem(ACTIVE_KEY)||'null');if(a&&a.id)ACCOUNT=a;}catch(e){}
  loadAll();
  applyTheme(localStorage.getItem('cw_theme')||'light');
  applyPalette(localStorage.getItem('cw_palette')||'azure');
  renderSidebar();
  const am=document.getElementById('acctMask');if(am)am.classList.remove('show');
  closeLock();
  switchTab(curTab);
  showBanner('已恢复备份');
}
function showLock(){
  let ov=document.getElementById('lockMask');
  if(!ov){ov=document.createElement('div');ov.id='lockMask';ov.className='lock-mask';ov.innerHTML=`<div class="lk-cat">🐱</div><div style="font-size:18px">${esc(ACCOUNT.name)} 已上锁</div><input type="password" id="lockPwd" placeholder="输入密码解锁" class="input" style="max-width:240px;padding:10px"><button class="btn primary" id="lockGo">解锁</button><button class="btn" id="lockSwitch">切换账户</button><div class="muted" id="lockMsg" style="font-size:12px;min-height:16px"></div>`;document.body.appendChild(ov);
    ov.querySelector('#lockGo').onclick=()=>{const pw=ov.querySelector('#lockPwd').value;if(hashPwd(pw)!==ACCOUNT.pwd){ov.querySelector('#lockMsg').textContent='密码错误';return;}ov.classList.remove('show');switchTab('home');};
    ov.querySelector('#lockPwd').onkeydown=e=>{if(e.key==='Enter')ov.querySelector('#lockGo').click();};
    ov.querySelector('#lockSwitch').onclick=()=>{ov.classList.remove('show');openAccount();};
  }
  ov.classList.add('show');
}
function closeLock(){const ov=document.getElementById('lockMask');if(ov)ov.classList.remove('show');}

/* ===== 全局搜索 / 命令面板 ===== */
function buildSearchIndex(){
  const I=[];
  const push=(tab,title,text,meta)=>{if(title||text)I.push({tab,title:String(title||''),text:String(text||''),meta:String(meta||'')});};
  (DATA.schedule||[]).forEach(s=>push('schedule',s.title,s.date+(s.time?' '+s.time:''),'日程待办'));
  (DATA.habits||[]).forEach(h=>push('fitness',h.name,'','习惯'));
  (DATA.finance||[]).forEach(f=>push('finance',f.note||(f.type==='income'?'收入':'支出'),'¥'+(f.amount||0),'理财'));
  (DATA.goal||[]).forEach(g=>push('treehole',g.text,(g.milestones||[]).map(m=>m.text).join(' / '),'目标'));
  (DATA.wish||[]).forEach(x=>push('treehole',x.text,'','心愿'));
  (DATA.shopping||[]).forEach(x=>push('treehole',x.text,'','待买'));
  (DATA.mood||[]).forEach(x=>push('treehole',x.text,'','碎碎念'));
  (DATA.media||[]).forEach(m=>push('books',m.title,(m.review||'')+' '+((m.takeaways||[]).join(' ')),'书影音'));
  (DATA.idea||[]).forEach(x=>push('inspire',x.text,'','灵感'));
  (DATA.english||[]).forEach(x=>push('english',x.text,'','英语'));
  (DATA.diet||[]).forEach(m=>push('diet',m.text,(m.meal||'')+' '+(m.kcal||'')+'kcal','饮食'));
  (DATA.friends||[]).forEach(f=>push('friends',f.name,(f.bday||'')+' '+(f.likes||''),'好友'));
  (DATA.moodlog||[]).forEach(m=>push('mood',m.note||'',(moodOf(m.emoji).n||'')+' '+((m.tags||[]).join(' ')),'情绪'));
  const tkMap={};(DATA.pomo||[]).filter(r=>r.kind==='work'&&r.task).forEach(r=>{tkMap[r.task]=(tkMap[r.task]||0)+(+r.min||0);});
  Object.keys(tkMap).forEach(k=>push('focus',k,tkMap[k]+' 分钟专注','专注任务'));
  return I;
}
function openSearch(){
  let ov=document.getElementById('cmdkMask');
  if(!ov){
    ov=document.createElement('div');ov.id='cmdkMask';ov.className='cmdk';
    ov.innerHTML=`<div class="cmdk-box">
      <input class="cmdk-inp" id="cmdkInp" placeholder="🔍 搜索 待办 / 灵感 / 好友 / 书影音 / 理财 / 目标 …" autocomplete="off">
      <div class="cmdk-list" id="cmdkList"></div>
      <div class="cmdk-foot"><span>↑↓ 选择</span><span>Enter 跳转</span><span>Esc 关闭</span></div>
    </div>`;
    document.body.appendChild(ov);
    const inp=ov.querySelector('#cmdkInp');
    const names={home:'综合首页',schedule:'日程待办',fitness:'运动',finance:'理财',treehole:'树洞',books:'书影音',inspire:'灵感',english:'英语',diet:'饮食',friends:'好友',mood:'情绪',focus:'专注统计'};
    let cur=0,res=[];
    const draw=()=>{const box=ov.querySelector('#cmdkList');if(!res.length){box.innerHTML='<div class="cmdk-empty">没有匹配结果</div>';return;}
      box.innerHTML=res.map((r,i)=>`<div class="cmdk-it ${i===cur?'on':''}" data-i="${i}"><div style="min-width:0"><div class="t">${esc(r.title||r.text||'(空)')}</div>${(r.meta||r.text)?`<div class="m">${esc(r.meta||r.text)}</div>`:''}</div><span class="x">${esc(names[r.tab]||r.tab)}</span></div>`).join('');
      box.querySelectorAll('.cmdk-it').forEach(it=>it.onclick=()=>{cur=+it.dataset.i;go();});
    };
    const go=()=>{const r=res[cur];if(!r)return;ov.classList.remove('show');switchTab(r.tab);};
    const refresh=q=>{const all=buildSearchIndex();const qq=q.trim().toLowerCase();res=qq?all.filter(r=>(r.title+' '+r.text+' '+r.meta).toLowerCase().includes(qq)):all.slice(0,50);
      cur=0;draw();};
    inp.oninput=()=>refresh(inp.value);
    inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();cur=Math.min(res.length-1,cur+1);draw();}else if(e.key==='ArrowUp'){e.preventDefault();cur=Math.max(0,cur-1);draw();}else if(e.key==='Enter'){e.preventDefault();go();}});
    ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('show');});
  }
  ov.classList.add('show');
  const inp=ov.querySelector('#cmdkInp');inp.value='';setTimeout(()=>inp.focus(),30);
  inp.dispatchEvent(new Event('input'));
}

/* ===== 启动 ===== */
migrateDefault();loadActive();ensureCurrentAcct();loadAll();
applyTheme(localStorage.getItem('cw_theme')||'light');
applyPalette(localStorage.getItem('cw_palette')||'azure');
renderSidebar();
$('#accountBtn').onclick=openAccount;
$('#paletteBtn').onclick=openPalette;
$('#searchBtn').onclick=openSearch;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}});
if(ACCOUNT.pwd){ showLock(); } else { switchTab('home'); }
$('#resetNav').onclick=resetNavOrder;

/* ===== PWA：注册 Service Worker（仅在 http/https 下生效；file:// 直接跳过，双击打开也能用） ===== */
if('serviceWorker' in navigator && typeof location!=='undefined' && String(location.protocol).indexOf('http')===0){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
