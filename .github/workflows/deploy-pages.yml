name: Deploy to GitHub Pages

# 推送到 main 时自动部署 deploy-site 目录
on:
  push:
    branches: [main]
    paths:
      - 'deploy-site/**'
      - 'life-workspace.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送取消进行中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 保证线上 index.html 永远和主文件一致，省掉手工 cp 那一步
      - name: Sync main HTML into deploy dir
        run: cp life-workspace.html deploy-site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy-site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
